name: Publish to gh-pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public-safety and shape check (blocks publishing on failure)
        run: node tools/validate.mjs
      - run: git push origin HEAD:gh-pages
